# templates/manifest.yaml — lite 内核流程规则的单一真相源
#
# 蒸馏来源（老仓 workflow-plugin，严格只读参考）：
#   · phases        ← skills/pipeline/manifest.yaml:phases（order 1..7 的 7 个相位）
#   · transitions   ← skills/pipeline/scripts/manifest.py:_DEFAULT_TRANSITIONS
#                     （event 边折叠为 from→to 相位边：build-complete=build→verify、
#                      verify-fail=verify→build 构成 build⇄verify 双向；
#                      archived=archive→archive 终态自环）
#   · review_phases ← skills/pipeline/manifest.yaml:review_phases。
#                     ⚠️ 老内核欠账：state-transition.sh 的 review-gate 块曾硬编码
#                     explore/spec/verify、未读该字段（manifest.yaml:78-80 自己注明"仅半接线"）。
#                     本仓引擎（packages/kernel/src/flow）**真读本字段**——改这里即改行为，
#                     回归锚见 flow.test.ts「review_phases 单一真相源回归锚」。
#
# 解析器 = kernel 手写窄解析（packages/kernel/src/flow/manifest.ts，CONTRACT §1 禁 yaml npm 包），
# 仅支持本文件用到的子集：
#   · 顶层键 `key:` / `key: [inline, list]`
#   · 块序列：两空格缩进 `- item`
#   · transitions 小节：两空格缩进 `from: [to1, to2]`
#   · `#` 整行注释、行尾注释（空白 + #）、空行
# 其余 YAML 特性（引号/锚点/多行标量/嵌套 map）一律不支持，遇到即 fail-loud。

# —— 7 相位，声明顺序即相位顺序（回退边判定 = 目标序号 < 当前序号）——
phases:
  - open
  - explore
  - spec
  - build
  - verify
  - ship
  - archive

# —— 转换图：from: [合法目标...] ——
# build 的 requirements-changed → spec 与 verify-fail → build 都是受控回退边，
# phase_status=in_progress；修订后的目标相位证据必须重新 record/read 才能再次前进。
# archive: [archive] = 终态自环（老内核 archived 事件，phase_status=done、archived=true 由 CLI 层落）。
# 每个已声明相位必须在此有条目（可为 []），缺条目 = 结构错误，loadManifest fail-loud。
transitions:
  open: [explore]
  explore: [spec]
  spec: [build]
  build: [verify, spec]
  verify: [ship, build]
  ship: [archive]
  archive: [archive]

# —— review-gate 相位：完成这些相位、准备离开时必须取得 canonical approval receipt ——
# 引擎经 isReviewPhase() 暴露判定；此列表是唯一真相源。`tenon review request` 才写 v2
# hook marker（receipt 同时绑定离开的 exact event），进入相位本身不写 marker，因而不会锁住该相位的调研/规格/验证工作。
review_phases: [explore, spec, verify]

# Skill contract 的显式动作授权。该版本化 closed list 是 AFK admission 的唯一 Skill 层来源；
# 不从 mandatory_skills / recommended_skills 的 slot 或任何 prose 推断权限。
# 不分 profile：这里只有一条全局授权（_all），对所有已知 skill profile 一视同仁。
# 哪些任务能进 AFK 不由这里决定，而是任务所选工作流分支的 automation（项目层）。
skill_action_authority:
  version: v1
  _all: [enter-afk]

# ══════════════════════════════════════════════════════════════════════════════
# 全派生面数据节（BACKLOG #18 / GOAL A1）——全部经 kernel loadManifest 真派生，零硬编码。
# 蒸馏来源：老仓 skills/pipeline/manifest.yaml + scripts/manifest.py（严格只读参考）。
# 改这里任一数据 → 派生随之变（单一真相源钉死，manifest-derive.test.ts 回归锚）。
# ══════════════════════════════════════════════════════════════════════════════

# 一步该加载什么技能只看工作流 YAML（templates/workflows/default.yaml 的 skills）；这里不再有
# 「阶段 × 轨道」强制技能矩阵（它与 default.yaml 每步技能完全重复，去重后无效果），路由也读工作流分支。
#
# —— phase × track 推荐 skill 表（老 evidence 派生；缺只 WARN、不阻断）——
# 技能合一后不再声明推荐项：一步该加载什么由 default.yaml 的 skills 逐条说清楚。
recommended_skills:

# —— breadcrumb prose（老 phases.<phase>.breadcrumb 派生；`|` 字面块标量，缩进 4 定块界）——
# 消费方：router hook #19 每轮被动注入活跃 change 当前相位的行动提示。每步做什么来自工作流数据，
# 这里只指路：真正的清单在 `tenon status <change> --json` 的 step.next。
# 末尾换行 rstrip（对齐老 CLI `bc.rstrip("\n")`）；内部换行/空行逐字保留。
breadcrumb:
  open: |
    立项：按 tenon status <change> --json 的 step.next 执行。
  explore: |
    调研：按 tenon status <change> --json 的 step.next 执行。
  spec: |
    规格：按 tenon status <change> --json 的 step.next 执行。
  build: |
    实现：按 tenon status <change> --json 的 step.next 执行。
  verify: |
    验证：按 tenon status <change> --json 的 step.next 执行。
  ship: |
    交付：按 tenon status <change> --json 的 step.next 执行。
  archive: |
    完结：按 tenon status <change> --json 的 step.next 执行。
