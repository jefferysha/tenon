        outputs:
          - field: verification_report
            type: file_path
        artifacts:
          - field: verification_report
            type: file_path
            producer_policy: effective-phase-skills
        guards: []
        transitions:
          - event: verify-pass
            to: ship
          - event: verify-fail
            to: build
            actions:
              - type: mark-verification-failed
              - type: reset-pre-verify-review
      - id: ship
        label: 交付
        gate: null
        skills:
          - id: tenon-ship
          - id: openspec-apply-change
          - id: to-spec
          - id: to-tickets
        inputs:
