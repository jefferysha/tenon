            type: file_path
        artifacts:
          - field: design_doc
            type: file_path
            producer_policy: effective-phase-skills
        guards: []
        transitions:
          - event: explore-complete
            to: spec
      - id: spec
        label: 规格
        gate: review
        skills:
          - id: openspec-propose
          - id: brainstorming
          - id: writing-plans
          - id: grill-with-docs
        inputs:
          - field: design_doc
            type: file_path
        outputs:
