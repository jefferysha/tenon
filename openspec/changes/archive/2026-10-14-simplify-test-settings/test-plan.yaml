waivers:
  - test: code-size
    reason: default 的 code-size 上限（lines_added ≤ 2000）冻结自旧运行时，本任务正是删掉它（spec test-settings「不设代码规模上限」）。探针统计约 2 万行（不含文档与 Markdown），构成：构建产物 dist 约 6500 行（npm run build 生成，CI 逐字节校验，单文件最大的 cli/dist/tenon.mjs 也在其中）；测试与夹具约 9000；手写生产代码约 4300（kernel 2200、CLI 950、Dashboard 730），TS 生产文件都在 500 行内。
    approved_by: 710227704@qq.com
    approved_candidate: workspace:sha256:3e5c86ff441a3efd5e4604265fd80dc27bc5ecc6276a08753c8c5bc6744c02a2
