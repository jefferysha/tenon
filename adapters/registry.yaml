# adapters/registry.yaml — 适配器登记表（单一真源，BACKLOG #39）。
#
# 老仓 registry.yaml 是「install 派发 + skill 源」表；本表在 lite 里聚焦 **能力矩阵**：
# 每个目标工具对 inject/veto/track 三能力的档位（native/degraded）与产出格式。这是把
# contract.md 变机器约束的数据源——tools/test-adapters.sh 从本表派生 conformance 断言，
# adapters/lint-adapter.sh 从本表校验「加平台是填表非重写」（GOAL D7/D14 平台矩阵策略面）。
#
# 三能力（= Claude Code baseline 三 hook；适配器要在其它工具上等价实现或降级）：
#   inject  ← hooks/session-start.sh  （SessionStart 会话级上下文注入）
#   veto    ← hooks/gate.sh           （PreToolUse 硬拦：新鲜 .pipeline-pending-* marker → 拒）
#   track   ← hooks/skill-tracker.sh  （PostToolUse Skill → append .pipeline-history.jsonl）
#
# 分档（tier，contract.md §1）：
#   A 全保真  三能力全 native 等价（codex：与 CC 同构 hook 协议）
#   B 部分降级 部分 native、部分如实降级（cursor：veto/track native、inject 降 .cursor/rules）
#   C 静态降级 无 enforcement hook，三能力靠静态注入 + 保留人工确认事实的 CLI receipt（codex --static / workflow-only 平台）
#
# 每平台扁平字段（缺任一 lint-adapter.sh 报错）：
#   tier            A|B|C
#   configDir       检测/托管路径锚
#   cliFlag         顶层 install.sh 的 --<flag> 派发键
#   configure       install 入口脚本（相对仓库根；baseline claude-code 为内建插件，留空）
#   agentCapable    true → 过滤 user-facing start
#   hasHooks        true → 要求 hookContainer 非空
#   hookContainer   hook 安装目标容器
#   <cap>_status    native|degraded|none（cap ∈ inject/veto/track）
#   <cap>_format    该能力在目标工具的 stdout/exit 格式（不串格式，见 contract.md §3）
#   inject_fallback inject_status=degraded 时必填：降级落点（如 static-rules）
#   veto_failclosed cursor 专用：veto hook 默认 fail-open，必须 true 才与硬拦语义一致

platforms:
  - id: claude-code
    tier: A
    role: baseline
    configDir: .claude
    cliFlag: claude
    defaultChecked: true
    agentCapable: true
    hasHooks: true
    hookContainer: .claude/settings.json#hooks
    configure: ""
    inject_status: native
    inject_event: SessionStart
    inject_format: json-additionalContext
    veto_status: native
    veto_event: PreToolUse
    veto_format: exit2-stderr
    track_status: native
    track_event: PostToolUse
    track_format: history-append

  # codex：与 CC 同构 hook 协议（spike 实证）——三能力全 native，wrapper 薄包 baseline 三 hook。
  #   inject 走 hookSpecificOutput.additionalContext；veto 走 exit 2 + stderr；track append history。
  #   受 hook trust 卡（档 A manual-trust / 档 B managed-免trust / 档 C static-无hook），见 codex/README.md。
  - id: codex
    tier: A
    configDir: .codex
    cliFlag: codex
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .codex/hooks.json
    configure: adapters/codex/install.sh
    inject_status: native
    inject_event: SessionStart
    inject_format: json-additionalContext
    veto_status: native
    veto_event: PreToolUse
    veto_format: exit2-stderr
    track_status: native
    track_event: PostToolUse
    track_format: history-append

  # cursor：veto/track native（beforeShellExecution/preToolUse 硬拦、postToolUse 留痕），
  #   inject 无 SessionStart 级原语 → 降级 .cursor/rules/tenon.mdc 静态层（alwaysApply；Cursor 忽略 .md 规则）
  #   + postToolUse.additional_context 动态补。
  #   veto 默认 fail-open，hooks.json 必 failClosed:true（否则 hook 崩了放行，与硬拦冲突）。无 trust 机制。
  - id: cursor
    tier: B
    configDir: .cursor
    cliFlag: cursor
    defaultChecked: true
    agentCapable: true
    hasHooks: true
    hookContainer: .cursor/hooks.json
    configure: adapters/cursor/install.sh
    inject_status: degraded
    inject_fallback: static-rules
    inject_event: postToolUse
    inject_format: postToolUse-additional_context
    veto_status: native
    veto_event: preToolUse
    veto_format: permission-json
    veto_failclosed: true
    track_status: native
    track_event: postToolUse
    track_format: history-append

  # ─── #40 铺量：#39 planned 四平台转 active（填表式扩展，D7/D14 平台矩阵）───
  # gemini：Gemini CLI hook 与 CC 同构（settings.json#hooks 内嵌）——三能力全 native，档 A。
  #   三 wrapper 薄包 baseline hooks/session-start.sh · gate.sh · skill-tracker.sh（同 codex 做法）。
  #   已知 caveat：sub-agent 层无 inject-subagent-context（#18128），仅限 sub-agent，不降主档。
  - id: gemini
    tier: A
    configDir: .gemini
    cliFlag: gemini
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .gemini/settings.json#hooks
    configure: adapters/gemini/install.sh
    inject_status: native
    inject_event: SessionStart
    inject_format: json-additionalContext
    veto_status: native
    veto_event: PreToolUse
    veto_format: exit2-stderr
    track_status: native
    track_event: PostToolUse
    track_format: history-append

  # copilot：GitHub Copilot coding agent。veto/track native（dual hookContainer——两份都写，漏一份不生效）；
  #   inject **降级**：copilot session-start 为平台私有、不可控 → 落 .github/copilot-instructions.md 静态层
  #   （平台文档级上下文文件）+ userPromptSubmitted 动态补。档 B（不伪装会话级 inject）。
  - id: copilot
    tier: B
    configDir: .github/copilot
    cliFlag: copilot
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .github/copilot/hooks.json|.github/hooks/tenon.json
    configure: adapters/copilot/install.sh
    inject_status: degraded
    inject_fallback: copilot-instructions
    inject_event: userPromptSubmitted
    inject_format: static-instructions
    veto_status: native
    veto_event: preToolUse
    veto_format: exit2-stderr
    track_status: native
    track_event: postToolUse
    track_format: history-append

  # pi：Pi Agent（settings.json#hooks 内嵌 + 私有 .pi/skills 根 + .pi/extensions TS 运行时）。
  #   inject/track native（SessionStart 注入 + PostToolUse 留痕，wrapper 薄包 baseline）；
  #   veto **降级**：pi 无原生 pre-tool 硬拦 hook——enforcement 走 .pi/extensions 运行时 advisory
  #   + CLI review receipt（不伪装原生硬拦）。档 B。
  - id: pi
    tier: B
    configDir: .pi
    cliFlag: pi
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .pi/settings.json#hooks
    configure: adapters/pi/install.sh
    inject_status: native
    inject_event: SessionStart
    inject_format: json-additionalContext
    veto_status: degraded
    veto_fallback: extension-advisory
    veto_event: none
    veto_format: static-advisory
    track_status: native
    track_event: PostToolUse
    track_format: history-append

  # devin（前 Windsurf）：workflow-only 平台（hasHooks=false，无任何 enforcement hook）。
  #   三能力**全静态降级**：inject 落 .devin/workflows 静态层、veto 靠 CLI review receipt、
  #   track 无自动留痕（如实标注不伪装）。档 C——诚实：devin 确实只能到 C 档。
  #   windsurf 用户经 --devin 派发（Cognition 2026-06 改名，见 adapters/devin/README.md）。
  - id: devin
    tier: C
    configDir: .devin/workflows
    cliFlag: devin
    defaultChecked: false
    agentCapable: false
    hasHooks: false
    hookContainer: ""
    configure: adapters/devin/install.sh
    inject_status: degraded
    inject_fallback: static-workflow
    inject_event: none
    inject_format: static-workflow-md
    veto_status: degraded
    veto_fallback: cli-review-receipt
    veto_event: none
    veto_format: manual-cli-review-receipt
    track_status: degraded
    track_fallback: manual-note
    track_event: none
    track_format: none

  # ─── #41 长尾铺量批次 1/5：zed（研究结论，档 C，与 longtail 原目标档一致）───
  # zed：Zed Agent Panel 无自定义 enforcement hook（官方 rules 文档只是静态 system-prompt 拼接；
  #   zed-industries/zed#57890/#57943「lifecycle hooks」提案尚未实现，2026-07-07 spike 实证）。
  #   三能力全静态降级（同 devin 形），本目录无 hooks/（不伪装强制）。静态层写入 Zed 生效的项目指令文件
  #   （.rules → … → GEMINI.md 第一个存在的，否则 AGENTS.md），不再新建会遮住 AGENTS.md / CLAUDE.md 的 .rules。
  - id: zed
    tier: C
    configDir: .rules
    cliFlag: zed
    defaultChecked: false
    agentCapable: false
    hasHooks: false
    hookContainer: ""
    configure: adapters/zed/install.sh
    inject_status: degraded
    inject_fallback: static-rules
    inject_event: none
    inject_format: static-rules-md
    veto_status: degraded
    veto_fallback: cli-review-receipt
    veto_event: none
    veto_format: manual-cli-review-receipt
    track_status: degraded
    track_fallback: manual-note
    track_event: none
    track_format: none

  # ─── #41 长尾铺量批次 2/5：aider（研究结论，档 B，与 longtail 原目标档一致）───
  # aider：无 pre-tool hook 原语（lint-cmd/test-cmd 只在编辑*后*跑，挡不住写入本身，2026-07-07
  #   spike 实证 aider.chat 官方文档）——veto 降级为 commit-gate（.git/hooks/pre-commit，只挡
  #   commit 不挡写盘，如实标降级）。inject/track 走 aider 自身"始终自动生效"的真实原语：
  #   .aider.conf.yml 的 read: 静态只读文件（每次启动重新读盘，非缓存，视为 native）+
  #   git post-commit 留痕（把 commit 当工作单元，track 语义诚实再解释）。
  - id: aider
    tier: B
    configDir: .aider.conf.yml
    cliFlag: aider
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: ".git/hooks/pre-commit|.git/hooks/post-commit"
    configure: adapters/aider/install.sh
    inject_status: native
    inject_event: process-start
    inject_format: conf-read-file
    veto_status: degraded
    veto_fallback: commit-gate
    veto_event: pre-commit
    veto_format: git-hook-exit-nonzero
    track_status: native
    track_event: post-commit
    track_format: history-append

  # ─── #41 长尾铺量批次 3/5：continue（研究结论，档由原目标 B **上修为 A**，见下方纠偏说明）───
  # continue：面向 Continue **CLI**（`cn`），非 IDE 插件 config.yaml/rules（该面 spike 实测无任何
  #   hook，只是静态文本）。Continue CLI 源码（extensions/cli/src/hooks/types.ts 头注）明确自称
  #   与 Claude Code hook 协议逐字同构——三能力全 native，与 codex/gemini 同一填表模式。
  - id: continue
    tier: A
    configDir: .continue
    cliFlag: continue
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .continue/settings.json#hooks
    configure: adapters/continue/install.sh
    inject_status: native
    inject_event: SessionStart
    inject_format: json-additionalContext
    veto_status: native
    veto_event: PreToolUse
    veto_format: exit2-stderr
    track_status: native
    track_event: PostToolUse
    track_format: history-append

  # ─── #41 长尾铺量批次 4/5：cline（研究结论，档由原目标 B **上修为 A**，见 README 纠偏说明）───
  # cline：直读 cline/cline 开源仓库源码（.clinerules/hooks/README.md + hooks.proto +
  #   sdk/examples/hooks/PreToolUse_BlockDestructive.sh）确认 PreToolUse 真硬拦
  #   （{"cancel":true} 阻止工具执行，非审批流）+ PostToolUse 真留痕 + TaskStart/TaskResume 真注入
  #   ——三能力全 native。schema 与 CC 不同构（stdin-only、workspaceRoots 数组、恒 JSON 输出，
  #   不串格式）；hookContainer 是物理文件目录而非单一 JSON manifest，故 install.sh 生成薄 shim
  #   文件转发到本仓库 hooks/ 实体（见 README）。track 强制 tool_name="Skill" 映射真实工具名进
  #   skill 字段，避免"声明 native 却对真实工具调用恒不触发"。
  - id: cline
    tier: A
    configDir: .clinerules/hooks
    cliFlag: cline
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .clinerules/hooks/
    configure: adapters/cline/install.sh
    inject_status: native
    inject_event: TaskStart
    inject_format: contextModification-json
    veto_status: native
    veto_event: PreToolUse
    veto_format: cancel-json
    track_status: native
    track_event: PostToolUse
    track_format: history-append

  # ─── #41 长尾铺量批次 5/5：amp（研究结论，档 A，与 longtail 原目标档一致——但载体不同构，见下）───
  # amp：Amp 没有"外部命令 + stdin JSON + exit code"式 hook 协议（与 codex/gemini/continue 不
  #   同构，spike 实证：反编译已发布 npm 包 @ampcode/cli-darwin-arm64 真实二进制字符串，逐字确认
  #   事件分发表 event:{sessionStart,toolCall,toolResult,agentStart,agentEnd} + tool.call 可返回
  #   "reject-and-continue"真硬拦 + session.start 每 thread 仅一次去重逻辑）。原生扩展机制是进程内
  #   JS/TS 插件（.amp/plugins/<name>.js，Bun 加载，amp.on(event,handler) 注册）——传输层与其余
  #   A 档平台不同构，但三能力保真度不打折（真硬拦/真会话级注入/真留痕），contract §1 档 A 判据
  #   是能力保真而非传输协议一致，故仍归类 A，非新档位。诚实边界（未经真实 Amp 会话端到端实测，
  #   event payload 具体字段名为防御性推断）见 adapters/amp/README.md §5。
  - id: amp
    tier: A
    configDir: .amp/plugins
    cliFlag: amp
    defaultChecked: false
    agentCapable: true
    hasHooks: true
    hookContainer: .amp/plugins/pipeline.js
    configure: adapters/amp/install.sh
    inject_status: native
    inject_event: agent.start
    inject_format: contextModification-messages
    veto_status: native
    veto_event: tool.call
    veto_format: reject-and-continue
    track_status: native
    track_event: tool.result
    track_format: history-append

# ─── 长尾平台（D14 平台广度：证明"填表即可扩"，策略证明 > 穷举 padding）───
# 全部 5 项长尾平台（aider/continue/cline/amp/zed）已于 2026-07-07 #41 批次转 active——本表当前
# 无剩余 longtail 条目。活跃 12（claude-code/codex/cursor/gemini/copilot/pi/devin/zed/aider/
# continue/cline/amp），策略面对标 Tenon contract 16 平台 / Tenon runtime 30 平台（加平台成本 = 填表，不是重写内核）。
#
# 2026-07-07 #41 长尾铺量批次逐项处置（如实纠偏记录，非全盘照抄原表）：
#   - zed（档 C）/ aider（档 B）：与原目标档一致。
#   - continue（目标档 B → **上修为 A**）：面向 Continue **CLI**（`cn`，非 IDE 插件 config.yaml/
#     rules），源码自证与 CC hook 协议逐字同构。
#   - cline（目标档 B → **上修为 A**）：.clinerules/hooks/README.md + hooks.proto +
#     sdk/examples/hooks/ 证实 PreToolUse 真硬拦（{"cancel":true} 阻止工具执行）+ PostToolUse
#     真留痕 + TaskStart/TaskResume 真注入。
#   - amp（档 A，与原目标一致）：spike 证实与 CC **不同构**（进程内插件而非 exit-code 子进程），
#     但三能力保真度不打折，按 contract §1"能力保真"判据仍归 A（非"传输协议同构才给 A"）；
#     诚实边界（未经真实 Amp 会话端到端实测）见 adapters/amp/README.md §5。
#
# 长尾表结构保留（当前为空），供未来新增平台继续在此登记目标档位/降级点（"待建 configure"）。
longtail: []
