name: Release candidate (pre-tag)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character main commit SHA to release
        required: true
      tag:
        description: V-prefixed semver tag to create, or recover when already bound to the same SHA
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  pre-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Prove exact current main candidate and compatible tag
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_SHA" in
            *[!0-9a-fA-F]*|'') echo "ref must be a full hexadecimal commit SHA" >&2; exit 1 ;;
          esac
          [ "${#CANDIDATE_SHA}" -eq 40 ] || {
            echo "ref must contain exactly 40 hexadecimal characters" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag must be a complete stable v-prefixed SemVer" >&2
            exit 1
          }
          git fetch --force --no-tags origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          [ "$head" = "$CANDIDATE_SHA" ] && [ "$head" = "$main" ] || {
            echo "candidate drift: input=$CANDIDATE_SHA checkout=$head origin/main=$main" >&2
            exit 1
          }
          [ "$DISPATCH_SHA" = "$CANDIDATE_SHA" ] && [ "$WORKFLOW_SHA" = "$CANDIDATE_SHA" ] || {
            echo "workflow must be dispatched from the exact candidate main commit" >&2
            exit 1
          }
          [ "$WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml@refs/heads/main" ] || {
            echo "workflow definition is not owned by refs/heads/main: $WORKFLOW_REF" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            [ "$existing_commit" = "$CANDIDATE_SHA" ] || {
              echo "release tag already exists at a different commit: tag=$RELEASE_TAG expected=$CANDIDATE_SHA actual=$existing_commit" >&2
              exit 1
            }
            echo "release tag already exists at the approved candidate; recovery may continue"
          fi
          version="${RELEASE_TAG#v}"
          root_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./.codex-plugin/plugin.json').version")"
          claude_version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          [ "$version" = "$root_version" ] &&
            [ "$version" = "$plugin_version" ] &&
            [ "$version" = "$claude_version" ] || {
              echo "version mismatch: tag=$version root=$root_version codex=$plugin_version claude=$claude_version" >&2
              exit 1
            }
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Block advisories and invalid, extraneous, or incompatible resolved trees
        run: npm run check:dependencies

      - name: Prove release workflow anti-bypass contract
        run: npm run check:release-workflows

      - name: OpenSpec strict governance validation
        run: npm run check:openspec

      - name: Repository, identity, compatibility, and package gates
        run: |
          npm run check:comments
          npm run check:architecture
          npm run check:identity
          npm run check:repository-hygiene
          npm run check:npx-package
          npm run check:legacy-bridge
          npm run check:default-workflow-freshness

      - name: Build complete release payload and prove committed freshness
        run: |
          npm run build
          git diff --exit-code -- \
            packages/cli/dist/tenon.mjs \
            packages/server/dist/dashboard.mjs
          npm run check:dashboard-dist-freshness
          bash tools/verify-skills.sh
          n_minus="$RUNNER_TEMP/tenon-n-minus-one"
          if bash tools/prepare-n-minus-one-release.sh "$n_minus"; then
            TENON_N_MINUS_ONE_PAYLOAD="$n_minus/payload" \
              TENON_N_MINUS_ONE_RELEASE="$(node -p "require('./tools/fixtures/n-minus-one-release.json').tag")" \
              bash tools/test-bundle.sh
          else
            code=$?
            [ "$code" -eq 78 ] || exit "$code"
            bash tools/test-bundle.sh
          fi

      - name: Documentation and governance-document gates
        run: |
          npm run check:docs
          npm run check:document-templates
          npm run check:design-scale
          npm run docs:sync
          npm run docs:check
          npm run docs:build
          npm run docs:smoke

      - name: Full runtime, Dashboard, hook, adapter, migration, and oracle verification
        run: |
          npm test
          npm run test:web
          bash tools/test-hooks.sh
          bash tools/test-adapters.sh
          npm run test:migration-cas
          npm run oracle

      - name: Real clean Codex install from candidate checkout
        run: |
          trusted_bin="$(bash tools/prepare-trusted-codex-acceptance.sh "$RUNNER_TEMP/tenon-codex-acceptance")"
          export PATH="$trusted_bin:$PATH"
          npm run test:clean-install

      - name: Re-prove main identity immediately before approval
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ]
          [ "$(git rev-parse origin/main)" = "$CANDIDATE_SHA" ] || {
            echo "main advanced while the release candidate was running; rerun against the new exact SHA" >&2
            exit 1
          }

      - name: Prove canonical CI passed for exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matching="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&event=push&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.event == "push" and .status == "completed" and .conclusion == "success") | .head_sha'
          )"
          printf '%s\n' "$matching" | grep -Fqx -- "$CANDIDATE_SHA" || {
            echo "canonical push CI has not succeeded for exact candidate: $CANDIDATE_SHA" >&2
            exit 1
          }

      - name: Package the verified release payload
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          TENON_NPM_PACKAGE: ${{ vars.TENON_NPM_PACKAGE }}
        run: |
          set -euo pipefail
          payload_dir=.release-candidate/payload
          mkdir -p "$payload_dir"

          npm run build:legacy-bridge
          tar -C .release -czf "$payload_dir/tenon-legacy-bridge-$RELEASE_VERSION.tar.gz" legacy-bridge

          if [ -n "$TENON_NPM_PACKAGE" ]; then
            node tools/build-npx-package.mjs \
              --package-name "$TENON_NPM_PACKAGE" \
              --ref "$RELEASE_TAG" \
              --output .release/npx-package
            npm pack .release/npx-package --pack-destination "$payload_dir"
          fi

          (
            cd "$payload_dir"
            shopt -s nullglob
            assets=(*)
            [ "${#assets[@]}" -gt 0 ]
            for asset in "${assets[@]}"; do
              [[ "$asset" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
                echo "unsafe release asset name: $asset" >&2
                exit 1
              }
            done
            printf '%s\0' "${assets[@]}" |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload the digest-bound release payload
        id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-payload-${{ steps.candidate.outputs.sha }}
          path: .release-candidate/payload
          if-no-files-found: error
          retention-days: 90

      - name: Write approval evidence for the default-branch writer
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_ID: ${{ github.workflow_ref }}
          SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_NAME: release-candidate-payload-${{ steps.candidate.outputs.sha }}
          PAYLOAD_ARTIFACT_DIGEST_HEX: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p .release-candidate
          payload_manifest_sha256="$(
            sha256sum .release-candidate/payload/SHA256SUMS | cut -d ' ' -f 1
          )"
          payload_artifact_id="$PAYLOAD_ARTIFACT_ID"
          payload_artifact_name="$PAYLOAD_ARTIFACT_NAME"
          [[ "$PAYLOAD_ARTIFACT_DIGEST_HEX" =~ ^[0-9a-f]{64}$ ]] || {
            echo "upload-artifact returned an invalid bare SHA-256 digest" >&2
            exit 1
          }
          # upload-artifact emits bare hex; the REST artifact API uses the digest-algorithm prefix.
          payload_artifact_digest="sha256:$PAYLOAD_ARTIFACT_DIGEST_HEX"
          jq -n \
            --arg sha "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_workflow_ref "$SOURCE_WORKFLOW_ID" \
            --arg source_workflow_sha "$SOURCE_WORKFLOW_SHA" \
            --arg payload_artifact_id "$payload_artifact_id" \
            --arg payload_artifact_name "$payload_artifact_name" \
            --arg payload_artifact_digest "$payload_artifact_digest" \
            --arg payload_manifest_sha256 "$payload_manifest_sha256" \
            '{
              sha: $sha,
              tag: $tag,
              version: $version,
              source_run_id: $source_run_id,
              source_workflow_ref: $source_workflow_ref,
              source_workflow_sha: $source_workflow_sha,
              payload_artifact_id: $payload_artifact_id,
              payload_artifact_name: $payload_artifact_name,
              payload_artifact_digest: $payload_artifact_digest,
              payload_manifest_sha256: $payload_manifest_sha256
            }' > .release-candidate/approved.json

      - name: Publish approval evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-approval
          path: .release-candidate/approved.json
          if-no-files-found: error
          retention-days: 90
