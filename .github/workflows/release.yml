name: Release Tenon

on:
  workflow_call:
    inputs:
      tag:
        description: Candidate-created v-prefixed tag
        type: string
        required: true
      expected_sha:
        description: Approved candidate commit SHA
        type: string
        required: true
      version:
        description: Approved stable SemVer without the v prefix
        type: string
        required: true
      source_run_id:
        description: Trusted release-candidate workflow run ID
        type: string
        required: true
      payload_artifact_id:
        description: Exact Actions artifact ID containing the verified payload
        type: string
        required: true
      payload_artifact_name:
        description: SHA-bound Actions artifact name
        type: string
        required: true
      payload_artifact_digest:
        description: GitHub-computed SHA-256 digest for the payload artifact
        type: string
        required: true
      payload_manifest_sha256:
        description: Approved SHA-256 digest of payload SHA256SUMS
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify approved payload and create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PAYLOAD_ARTIFACT_ID: ${{ inputs.payload_artifact_id }}
          PAYLOAD_ARTIFACT_NAME: ${{ inputs.payload_artifact_name }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ inputs.payload_artifact_digest }}
          PAYLOAD_MANIFEST_SHA256: ${{ inputs.payload_manifest_sha256 }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local release_tag="$1"
            local ref_json object_sha object_type tag_json depth
            ref_json="$(
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$release_tag" \
                --jq ".[] | select(.ref == \"refs/tags/$release_tag\")"
            )"
            [ -n "$ref_json" ] || return 1
            object_sha="$(jq -er '.object.sha' <<<"$ref_json")"
            object_type="$(jq -er '.object.type' <<<"$ref_json")"
            depth=0
            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              [ "$depth" -le 8 ] || {
                echo "tag indirection is too deep: $release_tag" >&2
                return 2
              }
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_sha="$(jq -er '.object.sha' <<<"$tag_json")"
              object_type="$(jq -er '.object.type' <<<"$tag_json")"
            done
            [ "$object_type" = "commit" ] || {
              echo "tag does not peel to a commit: $release_tag ($object_type)" >&2
              return 2
            }
            printf '%s\n' "$object_sha"
          }

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "release tag must be a complete stable v-prefixed SemVer" >&2
            exit 1
          }
          [ "$RELEASE_VERSION" = "${RELEASE_TAG#v}" ]
          case "$EXPECTED_SHA" in
            *[!0-9a-fA-F]*|'') echo "expected_sha must be a full hexadecimal commit SHA" >&2; exit 1 ;;
          esac
          [ "${#EXPECTED_SHA}" -eq 40 ] || {
            echo "expected_sha must contain exactly 40 hexadecimal characters" >&2
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PAYLOAD_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [ "$PAYLOAD_ARTIFACT_NAME" = "release-candidate-payload-$EXPECTED_SHA" ]
          [[ "$PAYLOAD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PAYLOAD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]

          tag_commit="$(resolve_tag_commit "$RELEASE_TAG")"
          [ "$tag_commit" = "$EXPECTED_SHA" ] || {
            echo "release tag does not peel to approved commit: tag=$RELEASE_TAG expected=$EXPECTED_SHA actual=$tag_commit" >&2
            exit 1
          }

          artifact="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAYLOAD_ARTIFACT_ID"
          )"
          artifact_digest="$(jq -er '.digest' <<<"$artifact")"
          [ "$(jq -r '.id' <<<"$artifact")" = "$PAYLOAD_ARTIFACT_ID" ]
          [ "$(jq -r '.name' <<<"$artifact")" = "$PAYLOAD_ARTIFACT_NAME" ]
          [ "$artifact_digest" = "$PAYLOAD_ARTIFACT_DIGEST" ]
          [ "$(jq -r '.expired' <<<"$artifact")" = "false" ]
          [ "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$SOURCE_RUN_ID" ]
          [ "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$EXPECTED_SHA" ]

          work_dir="$(mktemp -d "$RUNNER_TEMP/tenon-release.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAYLOAD_ARTIFACT_ID/zip" \
            > "$work_dir/payload.zip"

          archive_entries=()
          while IFS= read -r archive_entry; do
            archive_entries+=("$archive_entry")
          done < <(unzip -Z1 "$work_dir/payload.zip")
          [ "${#archive_entries[@]}" -ge 2 ] || {
            echo "release payload archive is unexpectedly empty" >&2
            exit 1
          }
          for entry in "${archive_entries[@]}"; do
            [[ "$entry" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
              echo "unsafe release payload archive entry: $entry" >&2
              exit 1
            }
          done

          mkdir "$work_dir/payload"
          unzip -q "$work_dir/payload.zip" -d "$work_dir/payload"
          manifest="$work_dir/payload/SHA256SUMS"
          [ -f "$manifest" ] && [ ! -L "$manifest" ]
          [ "$(sha256sum "$manifest" | cut -d ' ' -f 1)" = "$PAYLOAD_MANIFEST_SHA256" ]

          assets=()
          while IFS= read -r manifest_line; do
            [[ "$manifest_line" =~ ^([0-9a-f]{64})\ \ ([A-Za-z0-9][A-Za-z0-9._-]*)$ ]] || {
              echo "unsafe SHA256SUMS entry: $manifest_line" >&2
              exit 1
            }
            asset_name="${BASH_REMATCH[2]}"
            [ "$asset_name" != "SHA256SUMS" ]
            if [ "${#assets[@]}" -gt 0 ]; then
              for existing_name in "${assets[@]}"; do
                [ "$existing_name" != "$asset_name" ] || {
                  echo "duplicate SHA256SUMS asset: $asset_name" >&2
                  exit 1
                }
              done
            fi
            assets+=("$asset_name")
          done < "$manifest"
          [ "${#assets[@]}" -gt 0 ]
          [ "${#archive_entries[@]}" -eq "$(( ${#assets[@]} + 1 ))" ]
          (
            cd "$work_dir/payload"
            sha256sum --check --strict SHA256SUMS
          )

          expected_assets=("SHA256SUMS" "${assets[@]}")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json tagName,isDraft,isPrerelease,assets
            )"
            [ "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG" ]
            [ "$(jq -r '.isDraft' <<<"$release_json")" = "false" ]
            [ "$(jq -r '.isPrerelease' <<<"$release_json")" = "false" ]
            while IFS= read -r existing_asset; do
              known=false
              for expected_asset in "${expected_assets[@]}"; do
                if [ "$existing_asset" = "$expected_asset" ]; then
                  known=true
                  break
                fi
              done
              [ "$known" = true ] || {
                echo "existing release contains an unapproved asset: $existing_asset" >&2
                exit 1
              }
            done < <(jq -r '.assets[].name' <<<"$release_json")
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --generate-notes \
              --title "Tenon $RELEASE_VERSION"
            release_json='{"assets":[]}'
          fi

          mkdir "$work_dir/existing"
          for asset_name in "${expected_assets[@]}"; do
            source_asset="$work_dir/payload/$asset_name"
            [ -f "$source_asset" ] && [ ! -L "$source_asset" ]
            if jq -e --arg name "$asset_name" '.assets[] | select(.name == $name)' \
              <<<"$release_json" >/dev/null; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" \
                --dir "$work_dir/existing"
              expected_digest="$(sha256sum "$source_asset" | cut -d ' ' -f 1)"
              actual_digest="$(sha256sum "$work_dir/existing/$asset_name" | cut -d ' ' -f 1)"
              [ "$actual_digest" = "$expected_digest" ] || {
                echo "existing release asset digest mismatch: $asset_name" >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$source_asset" \
                --repo "$GITHUB_REPOSITORY"
            fi
          done
