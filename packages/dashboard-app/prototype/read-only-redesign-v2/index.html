<script>
(function(){
  const originalRender=window.render;
  const stages=['立项','调研','规格','实现','验证','交付'];
  function tuneC(){
    if(variant!=='C')return;
    const layout=document.querySelector('.reader-layout');
    if(!layout)return;
    layout.classList.toggle('nav-collapsed',!!sidebarCollapsed);
    const explain=layout.querySelector('.status-explain');
    if(explain){explain.classList.add('status-compact');explain.textContent='需关注：阻塞 / 待决定'}
    layout.querySelector('.nav-caption')?.remove();
    const task=tasks?.find(x=>x.id===selected);
    const pane=layout.querySelector('.read-pane');
    const heading=pane?.querySelector('h2');
    if(task&&heading&&!pane.querySelector('.reader-stage')){
      const current=stages.indexOf(task.stage);
      const progress=stages.map((name,index)=>'<span class="stage-piece '+(name===task.stage?'current':index<current?'past':'')+'">'+name+'</span>').join('');
      heading.insertAdjacentHTML('afterend','<div class="stage-line reader-stage" aria-label="阶段进度">'+progress+'</div>');
    }
    const intro=pane?.querySelector('.intro');
    if(intro&&task)intro.textContent=(statusText?statusText(task):task.label)+' · '+task.stage;
    pane?.querySelector('.document ul')?.remove();
    const note=pane?.querySelector('.sample-note');
    if(note)note.textContent='示例文件 · 生产版动态读取';
  }
  window.render=function(){originalRender();tuneC()};
  tuneC();
})();
</script>
