<!doctype html>
<!--
  Tenon · 完整工作台原型（只读、示例数据）
  Open with: python3 -m http.server 18767 --bind 127.0.0.1 --directory packages/dashboard-app/prototype/full-workbench-v1
  Routes: ?page=workbench | projects | progress | automation | machine | settings
  This is a throwaway interaction study. It does not create tasks, install adapters, or mutate a project.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenon · 工作台原型</title>
  <style>
    :root {
      --bg: #f3f5f2;
      --surface: #ffffff;
      --surface-soft: #f8faf8;
      --surface-muted: #eef2ef;
      --ink: #18251f;
      --ink-2: #304039;
      --muted: #708078;
      --muted-2: #9aa69f;
      --line: #dfe6e0;
      --line-strong: #cbd7cf;
      --accent: #236a50;
      --accent-strong: #17543e;
      --accent-soft: #e7f1eb;
      --amber: #a66b1f;
      --amber-soft: #fff3df;
      --red: #b45146;
      --red-soft: #fff0ed;
      --blue: #58738b;
      --blue-soft: #edf3f7;
      --shadow-sm: 0 1px 2px rgba(22, 38, 29, .05), 0 8px 22px rgba(22, 38, 29, .04);
      --shadow-lg: 0 20px 60px rgba(16, 31, 24, .18);
      --radius: 14px;
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); font: 14px/1.5 var(--font); }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; background: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, p { margin: 0; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .mono { font-family: var(--mono); }

    .app-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns .2s ease; }
    .app-shell.rail-collapsed { grid-template-columns: 76px minmax(0, 1fr); }
    .rail { position: sticky; top: 0; z-index: 20; height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: 18px 14px; background: #edf1ee; border-right: 1px solid var(--line); transition: padding .2s ease; }
    .rail-brand { display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 8px; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 9px; color: #fff; background: var(--ink); font-size: 18px; font-weight: 760; letter-spacing: -.06em; }
    .brand-copy { min-width: 0; font-weight: 760; letter-spacing: -.04em; font-size: 20px; }
    .brand-caption { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .03em; }
    .rail-collapse { width: 29px; height: 29px; display: grid; place-items: center; margin-left: auto; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
    .rail-collapse:hover { color: var(--accent); border-color: var(--accent); }
    .rail-section-label { padding: 0 10px; color: var(--muted-2); font-size: 10px; font-weight: 740; letter-spacing: .12em; text-transform: uppercase; }
    .rail-nav { display: grid; gap: 4px; }
    .rail-link { display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 11px; border-radius: 10px; color: var(--muted); text-align: left; transition: background .15s, color .15s, transform .15s; }
    .rail-link:hover { color: var(--ink); background: var(--surface); }
    .rail-link.active { color: var(--accent-strong); background: var(--accent-soft); font-weight: 700; }
    .rail-link .rail-icon { width: 20px; display: grid; place-items: center; flex: none; }
    .rail-link small { margin-left: auto; min-width: 20px; padding: 1px 6px; color: var(--muted); border-radius: 99px; background: rgba(255,255,255,.76); font: 11px var(--mono); text-align: center; }
    .rail-link.active small { color: var(--accent); background: rgba(255,255,255,.85); }
    .rail-spacer { flex: 1; }
    .rail-project { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.62); }
    .project-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .rail-project strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .rail-project span { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .rail-footer { display: grid; gap: 5px; }
    .rail-footer button { display: flex; align-items: center; gap: 11px; min-height: 38px; padding: 0 11px; color: var(--muted); border-radius: 10px; text-align: left; }
    .rail-footer button:hover { color: var(--ink); background: var(--surface); }

    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 15; height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 32px; background: rgba(243,245,242,.92); border-bottom: 1px solid rgba(223,230,224,.8); backdrop-filter: blur(14px); }
    .crumb { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--ink); font-weight: 700; }
    .crumb-sep { color: var(--muted-2); }
    .project-switch-wrap { position: relative; }
    .project-switch { display: inline-flex; align-items: center; gap: 7px; max-width: 220px; padding: 7px 9px; color: var(--ink-2); border: 1px solid transparent; border-radius: 9px; font-size: 12px; font-weight: 650; }
    .project-switch:hover, .project-switch[aria-expanded="true"] { border-color: var(--line-strong); background: var(--surface); }
    .project-switch .project-dot { width: 6px; height: 6px; box-shadow: none; }
    .project-switch-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 60; width: 270px; padding: 7px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-lg); }
    .project-menu[hidden] { display: none; }
    .project-menu-head { padding: 8px 9px 7px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .project-option { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px 9px; border-radius: 8px; text-align: left; }
    .project-option:hover { background: var(--surface-muted); }
    .project-option.active { background: var(--accent-soft); }
    .project-option-copy { min-width: 0; flex: 1; }
    .project-option-copy strong, .project-option-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-option-copy strong { font-size: 12px; }
    .project-option-copy span { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .project-option-count { color: var(--muted); font: 11px var(--mono); }
    .top-search { width: min(310px, 30vw); min-width: 170px; height: 36px; display: flex; align-items: center; gap: 8px; margin-left: auto; padding: 0 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .top-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .top-search svg { width: 15px; height: 15px; flex: none; }
    .top-search input { width: 100%; min-width: 0; height: 100%; padding: 0; color: var(--ink); border: 0; outline: 0; background: transparent; font-size: 12px; }
    .top-search kbd { flex: none; padding: 1px 5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; background: var(--surface-soft); font: 10px var(--mono); }
    .top-actions { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .readonly-chip, .connection-chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 11px; }
    .readonly-chip { padding: 5px 8px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
    .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .avatar { width: 29px; height: 29px; display: grid; place-items: center; color: var(--accent-strong); border-radius: 50%; background: #d5e6db; font-size: 11px; font-weight: 750; }

    .content { max-width: 1480px; margin: 0 auto; padding: 31px 40px 90px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 24px; }
    .eyebrow { margin-bottom: 7px; color: var(--accent); font-size: 10px; font-weight: 760; letter-spacing: .14em; text-transform: uppercase; }
    .page-head h1 { font-size: clamp(27px, 3vw, 36px); line-height: 1.15; letter-spacing: -.045em; }
    .page-subtitle { max-width: 640px; margin-top: 9px; color: var(--muted); font-size: 13px; }
    .page-actions { display: flex; align-items: center; gap: 8px; }
    .button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 650; }
    .button:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
    .button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
    .button.primary:hover { border-color: var(--accent-strong); background: var(--accent-strong); }
    .button.ghost { border-color: transparent; background: transparent; }
    .button.ghost:hover { border-color: var(--line); background: var(--surface); }
    .icon-button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
    .icon-button:hover { color: var(--accent); border-color: var(--accent); }

    .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 17px; }
    .metric { min-height: 76px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { margin-top: 5px; font: 700 22px/1 var(--mono); letter-spacing: -.06em; }
    .metric-note { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .metric.attention .metric-value { color: var(--amber); }
    .metric.running .metric-value { color: var(--blue); }
    .metric.done .metric-value { color: var(--accent); }

    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 18px 14px; }
    .panel-title { font-size: 14px; font-weight: 760; letter-spacing: -.01em; }
    .panel-meta { color: var(--muted); font-size: 11px; }
    .section-kicker { color: var(--muted); font-size: 11px; font-weight: 700; }

    .stage-panel { margin-bottom: 18px; padding: 17px 18px 16px; }
    .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .stage-title-wrap { display: flex; align-items: baseline; gap: 10px; }
    .stage-title { font-size: 14px; font-weight: 760; }
    .stage-project { color: var(--muted); font: 11px var(--mono); }
    .stage-legend { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
    .legend-dot.current { background: var(--accent); }
    .legend-dot.attention { background: var(--amber); }
    .stage-track { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 8px; }
    .stage-step { position: relative; min-width: 0; padding-top: 10px; border-top: 3px solid var(--line); }
    .stage-step::after { content: ''; position: absolute; top: -7px; left: 0; width: 10px; height: 10px; border: 2px solid var(--line); border-radius: 50%; background: var(--surface); }
    .stage-step.done { border-color: var(--accent); }
    .stage-step.done::after { border-color: var(--accent); background: var(--accent); }
    .stage-step.current { border-color: var(--amber); }
    .stage-step.current::after { border-color: var(--amber); background: var(--amber-soft); box-shadow: 0 0 0 3px var(--amber-soft); }
    .stage-step strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .stage-step span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .stage-step.current strong { color: var(--amber); }

    .workbench-grid { display: grid; grid-template-columns: minmax(360px, .96fr) minmax(430px, 1.04fr); gap: 18px; align-items: start; }
    .queue-panel { min-width: 0; overflow: hidden; }
    .queue-toolbar { padding: 0 18px 12px; }
    .queue-toolbar-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
    .queue-toolbar-top .panel-title { font-size: 16px; }
    .inline-search { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); color: var(--muted); }
    .inline-search:focus-within { border-color: var(--accent); background: var(--surface); }
    .inline-search svg { width: 14px; height: 14px; }
    .inline-search input { width: 150px; max-width: 20vw; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 11px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-tab { min-height: 30px; padding: 0 9px; color: var(--muted); border: 1px solid transparent; border-radius: 7px; font-size: 11px; white-space: nowrap; }
    .filter-tab:hover { color: var(--ink); background: var(--surface-muted); }
    .filter-tab.active { color: var(--accent-strong); border-color: var(--line-strong); background: var(--accent-soft); font-weight: 750; }
    .filter-tab .count { margin-left: 4px; color: inherit; font: 10px var(--mono); opacity: .75; }
    .attention-hint { display: flex; align-items: center; gap: 6px; margin: 0 18px 12px; padding: 8px 9px; color: var(--muted); border: 1px solid #f1dfbe; border-radius: 8px; background: var(--amber-soft); font-size: 10px; }
    .attention-hint strong { color: var(--amber); }
    .task-list { border-top: 1px solid var(--line); }
    .task-row { display: block; width: 100%; padding: 15px 18px 14px; border-bottom: 1px solid var(--line); text-align: left; transition: background .14s, padding .14s; }
    .task-row:last-child { border-bottom: 0; }
    .task-row:hover { background: var(--surface-soft); }
    .task-row.selected { background: #f0f6f2; box-shadow: inset 3px 0 var(--accent); }
    .task-row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .task-name { min-width: 0; font-size: 13px; font-weight: 720; line-height: 1.35; }
    .task-name span { display: block; margin-top: 4px; overflow: hidden; color: var(--muted); font: 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 3px 7px; border-radius: 99px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.decision, .status.review { color: var(--amber); background: var(--amber-soft); }
    .status.blocked { color: var(--red); background: var(--red-soft); }
    .status.running { color: var(--blue); background: var(--blue-soft); }
    .status.done { color: var(--accent); background: var(--accent-soft); }
    .task-row-bottom { display: flex; align-items: center; gap: 14px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .task-row-bottom span { display: inline-flex; align-items: center; gap: 4px; }
    .task-row-bottom .next { overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
    .task-row-arrow { margin-left: auto; color: var(--muted-2); }
    .empty-state { padding: 32px 18px; color: var(--muted); text-align: center; font-size: 12px; }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink-2); font-size: 13px; }

    .focus-panel { min-width: 0; overflow: hidden; }
    .focus-top { padding: 19px 20px 16px; border-bottom: 1px solid var(--line); }
    .focus-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
    .focus-stage { color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .focus-top h2 { max-width: 560px; font-size: 22px; line-height: 1.25; letter-spacing: -.035em; }
    .focus-id { margin-top: 6px; color: var(--muted); font: 10px var(--mono); overflow-wrap: anywhere; }
    .focus-note { margin-top: 13px; color: var(--muted); font-size: 12px; }
    .next-action { display: flex; align-items: flex-start; gap: 9px; margin-top: 15px; padding: 10px 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); font-size: 11px; }
    .next-action svg { width: 15px; height: 15px; flex: none; color: var(--accent); margin-top: 1px; }
    .next-action strong { display: block; margin-bottom: 2px; font-size: 10px; }
    .focus-progress { padding: 16px 20px 14px; }
    .focus-progress-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .focus-progress-head strong { font-size: 11px; }
    .focus-progress-head span { color: var(--muted); font: 10px var(--mono); }
    .mini-track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
    .mini-stage { min-width: 0; }
    .mini-stage-bar { height: 4px; border-radius: 99px; background: var(--line); }
    .mini-stage.done .mini-stage-bar { background: var(--accent); }
    .mini-stage.current .mini-stage-bar { background: var(--amber); }
    .mini-stage span { display: block; margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .mini-stage.current span { color: var(--amber); font-weight: 700; }
    .file-workbench { margin: 0 20px 18px; padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); }
    .file-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .file-head strong { font-size: 12px; }
    .file-head span { color: var(--muted); font-size: 10px; }
    .file-tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--line); }
    .file-tab { min-height: 30px; padding: 0 8px; color: var(--muted); border-bottom: 2px solid transparent; font-size: 11px; }
    .file-tab.active { color: var(--ink); border-color: var(--accent); font-weight: 750; }
    .file-tab .count { margin-left: 4px; color: inherit; font: 10px var(--mono); }
    .file-summary { display: flex; justify-content: space-between; gap: 10px; margin: 10px 0 7px; color: var(--muted); font-size: 10px; }
    .files { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .file-row { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 42px; padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; }
    .file-row:last-child { border-bottom: 0; }
    .file-row:hover { background: var(--accent-soft); }
    .file-row svg { width: 15px; height: 15px; flex: none; color: var(--muted); }
    .file-copy { min-width: 0; flex: 1; }
    .file-copy strong, .file-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-copy strong { font-size: 11px; font-weight: 650; }
    .file-copy span { margin-top: 2px; color: var(--muted); font-size: 9px; }
    .file-state { flex: none; color: var(--accent); font-size: 10px; }
    .file-state.missing { color: var(--red); }
    .file-more { width: 100%; min-height: 31px; color: var(--accent); border-top: 1px solid var(--line); font-size: 10px; text-align: center; }
    .file-more:hover { background: var(--accent-soft); }
    .focus-footer { display: flex; align-items: center; justify-content: space-between; gap: 9px; padding: 0 20px 18px; }
    .focus-footer-note { color: var(--muted); font-size: 10px; }
    .terminal-handoff { display: flex; align-items: center; gap: 7px; margin: 0 20px 18px; padding: 9px 10px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 8px; font-size: 10px; }
    .terminal-handoff svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
    .terminal-handoff code { margin-left: auto; overflow: hidden; color: var(--ink-2); font: 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }

    .lower-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: 18px; margin-top: 18px; }
    .activity-list { padding: 0 18px 8px; }
    .activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
    .activity-icon { width: 25px; height: 25px; display: grid; place-items: center; flex: none; color: var(--accent); border-radius: 7px; background: var(--accent-soft); }
    .activity-icon svg { width: 13px; height: 13px; }
    .activity-copy { min-width: 0; flex: 1; }
    .activity-copy strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

      const counts = filterCounts(); const tasks = filteredTasks(); const task = selectedTask();
      return `<div class="content">${renderPageHead('WORKSPACE / OVERVIEW', '工作台', `${currentProject().name} · 只看需要决策、正在执行和已经产出的内容。`, `<button class="button" onclick="navigate('progress')">阶段视图 ${ico('arrow')}</button>`)}${renderMetrics(counts)}${renderStageTrack(projectTasks())}<div class="workbench-grid">${renderQueue(tasks, counts)}${renderFocus(task)}</div><div class="lower-grid">${renderActivity()}${renderPrinciples()}</div></div>`;
    }
    function projectCard(project) {
      const counts = filterCounts(project.id); const healthTone = project.health === '正常' ? '' : 'warn';
      return `<article class="project-card"><div class="project-main"><span class="project-avatar">${esc(project.name[0].toUpperCase())}</span><div><strong>${esc(project.name)}</strong><span title="${esc(project.path)}">${esc(project.path)}</span></div></div><div class="project-cell"><span class="project-cell-label">任务</span><strong>${counts.all} 项</strong><span>${counts.needs} 需要你 · ${counts.running} 进行中</span></div><div class="project-cell"><span class="project-cell-label">最近状态</span><span class="health ${healthTone}">${esc(project.health)}</span><span>${esc(project.updated)}</span></div><button class="button" onclick="setProject('${project.id}');navigate('workbench')">打开工作台 ${ico('arrow')}</button></article>`;
    }
    function renderProjects() {
      const q = state.query.trim().toLowerCase(); const list = projects.filter((project) => !q || `${project.name} ${project.desc} ${project.path}`.toLowerCase().includes(q));
      const totals = { all: projects.length, needs: projects.filter((p) => filterCounts(p.id).needs > 0).length, running: projects.filter((p) => filterCounts(p.id).running > 0).length, done: projects.filter((p) => filterCounts(p.id).done === filterCounts(p.id).all).length };
      return `<div class="content">${renderPageHead('WORKSPACE / PROJECTS', '项目', '选择一个工作区，再进入任务和文件。项目本身不承担执行动作。')}${renderMetrics({ all: totals.all, needs: totals.needs, running: totals.running, done: totals.done })}<section class="panel table-panel"><div class="panel-head"><div><h2 class="panel-title">所有项目</h2><p class="panel-meta" style="margin-top:3px">${q ? `搜索结果 · ${list.length} 个` : `${list.length} 个已连接项目`}</p></div><span class="panel-meta">默认按最近更新排序</span></div><div class="table-tools"><label class="table-search">${ico('search')}<input data-project-search type="search" aria-label="搜索项目" placeholder="搜索项目" value="${esc(state.query)}" oninput="setQuery(this.value)"></label><span class="result-note">搜索只在输入后过滤结果</span></div><div class="project-table">${list.length ? list.map(projectCard).join('') : `<div class="empty-state"><strong>没有匹配的项目</strong>检查项目名或路径</div>`}</div></section></div>`;
    }
    function renderProgress() {
      const list = projectTasks(); const current = list.find((task) => task.status !== 'done') || list[0]; const currentIndex = current ? stageIndex(current.stage) : 0;
      return `<div class="content">${renderPageHead('WORKSPACE / FLOW', '阶段进度', `${currentProject().name} · 每个阶段都显示真实状态和任务数量。`, `<button class="button" onclick="navigate('workbench')">回到工作台 ${ico('arrow')}</button>`)}<div class="progress-summary"><section class="panel progress-card"><p class="section-kicker">当前流程位置</p><div class="progress-big"><strong>${current ? stages[currentIndex].label : '—'}</strong><span>阶段 ${currentIndex + 1} / ${stages.length}</span></div><div class="progress-meter"><span style="width:${Math.max(8, Math.round((currentIndex / (stages.length - 1)) * 100))}%"></span></div><p class="progress-note">${current ? `${current.name} · ${statusMeta[current.status].label}` : '暂无任务'}</p></section><section class="panel progress-side"><div class="progress-side-row"><span>任务总数</span><strong>${list.length}</strong></div><div class="progress-side-row"><span>需要你</span><strong>${filterCounts().needs}</strong></div><div class="progress-side-row"><span>产出可读</span><strong>${list.filter((task) => task.outputs.some((file) => !file[2])).length}</strong></div><div class="progress-side-row"><span>已完成</span><strong>${filterCounts().done}</strong></div></section></div><div class="stage-board">${stages.map((stage, index) => { const stageTasks = list.filter((task) => task.stage === stage.id); return `<section class="stage-column ${index === currentIndex ? 'current' : ''}"><div class="stage-column-head"><strong>0${index + 1} ${stage.label}</strong><span>${stageTasks.length}</span></div><p class="stage-column-desc">${stage.desc}</p>${stageTasks.length ? stageTasks.map((task) => `<button class="board-task" onclick="openTaskSheet('${task.id}')">${statusChip(task, true)}<strong>${esc(task.name)}</strong><span>${esc(task.id)}</span></button>`).join('') : `<div class="board-empty">暂无任务</div>`}</section>`; }).join('')}</div></div>`;
    }
    function renderAutomation() {
      const list = taskData.filter((task) => task.status === 'running' || task.status === 'blocked' || task.status === 'review');
      return `<div class="content">${renderPageHead('CONTROL / AUTOMATION', '自动化', '只查看终端发起的运行状态；创建和重试回到终端。') }<div class="automation-grid"><div><section class="panel health-hero"><div class="health-hero-top"><div><p class="section-kicker">调度器</p><h2>运行状态正常</h2><p>当前项目 · ${esc(currentProject().name)}</p></div><span class="health-badge">已连接</span></div><div class="health-stats"><div class="health-stat"><strong>1</strong><span>运行中</span></div><div class="health-stat"><strong>1</strong><span>待处置</span></div><div class="health-stat"><strong>2</strong><span>最近完成</span></div></div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2 class="panel-title">运行队列</h2><p class="panel-meta" style="margin-top:3px">状态来自终端任务记录</p></div></div><div class="queue-table">${list.map((task) => `<button class="automation-row" onclick="openTaskSheet('${task.id}')"><div><strong>${esc(task.name)}</strong><span>${esc(task.id)}</span></div>${statusChip(task)}<span class="automation-time">${esc(task.updated)}</span></button>`).join('')}</div></section></div><div><div class="info-banner">${ico('info')}<span>工作台不创建任务，也不安装适配器。需要执行时，复制命令到项目终端。</span></div><section class="panel command-card" style="margin-top:12px"><h3>终端接管</h3><p>用于继续当前任务的示例命令</p><code class="command-code">cd $HOME/Documents/code-manager/projects/${esc(currentProject().name)}<br>tenon document record &lt;change&gt; ${esc(selectedTask().id)}</code><div class="command-actions"><button class="button" onclick="copyCommand()">${ico('copy')}复制命令</button></div></section></div></div></div>`;
    }
    function renderMachine() {
      return `<div class="content">${renderPageHead('CONTROL / HOST', '机器', '集中查看工作台依赖的主机事实和风险。') }<div class="machine-grid"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">运行准备度</h2><p class="panel-meta" style="margin-top:3px">${esc(currentProject().name)} · 最近检查刚刚完成</p></div><button class="button ghost" onclick="state.toast='已刷新检查时间';render();window.setTimeout(()=>{state.toast='';render()},1300)">刷新</button></div><div class="readiness-list" style="padding:0 18px 18px"><div class="readiness-card"><span class="readiness-icon">${ico('folder')}</span><div class="readiness-copy"><strong>项目工作区</strong><span>${esc(currentProject().path)}</span></div><span class="readiness-state">可读取</span></div><div class="readiness-card"><span class="readiness-icon">${ico('server')}</span><div class="readiness-copy"><strong>运行时</strong><span>Node 22 · Python 3.12</span></div><span class="readiness-state">就绪</span></div><div class="readiness-card warn"><span class="readiness-icon">${ico('alert')}</span><div class="readiness-copy"><strong>凭据</strong><span>1 个可选服务尚未配置</span></div><span class="readiness-state">注意</span></div></div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">需要留意</h2><p class="panel-meta" style="margin-top:3px">只列会影响下一步的风险</p></div></div><div class="risk-list"><div class="risk-row">${ico('alert')}<div><strong>适配器状态由终端维护</strong><span>工作台不提供网页安装入口。</span></div></div><div class="risk-row">${ico('clock')}<div><strong>验证报告尚未生成</strong><span>revision-guard 完成后会自动出现。</span></div></div><div class="risk-row">${ico('check')}<div><strong>项目连接正常</strong><span>文件可从本地 Change 目录读取。</span></div></div></div></section></div></div>`;
    }
    function renderSettings() {
      return `<div class="content">${renderPageHead('WORKSPACE / PREFERENCES', '设置', '调整阅读方式；执行仍由项目终端负责。') }<div class="settings-grid"><section class="panel settings-card"><div class="settings-section"><h3>显示</h3><p>让工作台保持安静，只露出需要处理的信息。</p><div class="setting-row"><div><strong>密度</strong><span>列表行距与信息量</span></div><div class="segmented"><button class="${!state.compact ? 'active' : ''}" onclick="state.compact=false;render()">舒适</button><button class="${state.compact ? 'active' : ''}" onclick="state.compact=true;render()">紧凑</button></div></div><div class="setting-row"><div><strong>减少说明文字</strong><span>隐藏辅助解释，保留状态和下一步</span></div><button class="toggle ${state.compact ? 'on' : ''}" aria-pressed="${state.compact}" onclick="toggleCompact()"></button></div></div><div class="settings-section"><h3>外观</h3><p>中性纸白与墨色，状态用少量语义色区分。</p><div class="setting-row"><div><strong>主题</strong><span>当前预览主题</span></div><div class="segmented"><button class="${state.theme === 'light' ? 'active' : ''}" onclick="toggleTheme('light')">浅色</button><button class="${state.theme === 'dark' ? 'active' : ''}" onclick="toggleTheme('dark')">深色</button></div></div></div></section><section class="panel settings-card"><div class="settings-section"><h3>状态说明</h3><p>页面内所有状态都使用以下口径。</p><div class="setting-row"><div><strong>需要你</strong><span>待决定或受阻</span></div>${statusChip({status:'decision'})}</div><div class="setting-row"><div><strong>进行中</strong><span>终端正在执行</span></div>${statusChip({status:'running'})}</div><div class="setting-row"><div><strong>待复核</strong><span>产出已到，等待确认</span></div>${statusChip({status:'review'})}</div><div class="setting-row"><div><strong>已完成</strong><span>阶段已交付</span></div>${statusChip({status:'done'})}</div></div><div class="settings-section"><div class="info-banner">${ico('terminal')}<span>任务创建、适配器安装、重试和终止都在终端完成。</span></div></div></section></div></div>`;
    }
    function renderTaskSheet() {
      const task = selectedTask(); if (!task) return '';
      const current = stageIndex(task.stage); const files = activeFiles(task); const readable = files.filter((file) => !file[2]).length; const selected = files.find((file) => file[0] === state.fileName) || files.find((file) => !file[2]) || files[0];
      return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><span>${esc(currentProject().name)} / 任务详情</span><button class="sheet-close" aria-label="关闭任务详情" onclick="closeSheet()">${ico('close')}</button></div><div class="sheet-hero"><p class="eyebrow">${esc(stages[current]?.label || '')} · Change</p><h2 id="sheet-title">${esc(task.name)}</h2><p class="sheet-id">${esc(task.id)}</p><div class="sheet-status-line">${statusChip(task)}<span>当前阶段 · ${esc(stages[current]?.label || '')}</span></div><div class="sheet-stage" aria-label="任务阶段进度">${stages.map((stage, index) => `<div class="sheet-stage-step ${index < current ? 'done' : index === current ? 'current' : ''}"><div class="sheet-stage-step-bar"></div><span>${stage.label}</span></div>`).join('')}</div></div><div class="sheet-context"><span class="sheet-context-label">当前情况</span><p>${esc(task.note)}</p><div class="next-action">${ico('arrow')}<div><strong>下一步</strong>${esc(task.next)}</div></div></div><div class="sheet-tabs"><button class="sheet-tab ${state.fileTab === 'input' ? 'active' : ''}" onclick="setFileTab('input')">输入 <span class="count">${task.inputs.length}</span></button><button class="sheet-tab ${state.fileTab === 'output' ? 'active' : ''}" onclick="setFileTab('output')">输出 <span class="count">${task.outputs.length}</span></button></div><div class="sheet-file-summary"><span>${state.fileTab === 'input' ? '任务依据文件' : '阶段产出文件'}</span><span>${readable} 可读 · ${files.length - readable} 缺失</span></div><div class="sheet-files ${state.filesExpanded ? '' : 'collapsed'}">${files.map(fileRow).join('')}${files.length > 3 ? `<button class="sheet-file-more" onclick="toggleFiles()">${state.filesExpanded ? '收起文件列表' : `查看全部 ${files.length} 个文件`}</button>` : ''}</div>${selected ? `<div class="document-preview"><div class="document-head"><span>${esc(selected[0])}</span><span class="file-state ${selected[2] ? 'missing' : ''}">${selected[2] ? '缺失' : '可读'}</span></div><div class="document-body">${selected[2] ? `<h3>等待产出</h3><p>文件尚未生成，完成终端任务后会在这里出现。</p>` : `<h3>${esc(task.name)}</h3><p>${esc(selected[1])} · 内容由 Change 目录动态读取。</p><code>${esc(task.id)}/${esc(selected[0])}</code>`}</div></div>` : ''}<div class="sheet-footer"><small>输入和输出按 Sheet 切换，文件默认折叠。</small><button class="button" onclick="copyCommand()">${ico('terminal')}复制接管命令</button></div></div>`;
    }
    function renderOverlay() {
      const overlay = document.getElementById('overlay');
      if (!state.sheet) { overlay.hidden = true; overlay.innerHTML = ''; return; }
      overlay.hidden = false; overlay.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeSheet()">${renderTaskSheet()}</div>`;
    }
    function render() {
      document.body.dataset.page = state.page;
      const page = state.page === 'workbench' ? renderWorkbench() : state.page === 'projects' ? renderProjects() : state.page === 'progress' ? renderProgress() : state.page === 'automation' ? renderAutomation() : state.page === 'machine' ? renderMachine() : renderSettings();
      document.getElementById('app').innerHTML = `<div class="app-shell ${state.railCollapsed ? 'rail-collapsed' : ''}">${renderRail()}<main class="main">${renderTopbar()}${page}</main></div>`;
      renderOverlay();
      const toast = document.getElementById('toast'); toast.hidden = !state.toast; toast.textContent = state.toast;
      if (state.compact) document.body.classList.add('compact'); else document.body.classList.remove('compact');
    }
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { if (state.sheet) { closeSheet(); return; } if (state.projectMenu) { state.projectMenu = false; render(); return; } }
      if (event.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) { event.preventDefault(); document.querySelector('[data-global-search]')?.focus(); }
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.project-switch-wrap') && state.projectMenu) { state.projectMenu = false; render(); }
    });
    window.addEventListener('popstate', () => { const next = new URLSearchParams(location.search); state.page = allowedPages.includes(next.get('page')) ? next.get('page') : 'workbench'; if (next.get('project')) setProject(next.get('project')); else render(); });
    render();
  </script>

<script>
  /* Extend the C workspace in place. Existing read-only-redesign-v2 remains untouched. */
  const _originalRenderRail = renderRail;
  const _originalRenderTopbar = renderTopbar;
  const _originalRenderWorkbench = renderWorkbench;
  function renderCRail() {
    if (state.page !== 'workbench' && state.page !== 'progress') return _originalRenderRail();
    const items = projects.map((project) => `<button class="project-rail-item ${project.id === state.project ? 'active' : ''}" onclick="setProject('${project.id}')" title="${esc(project.path)}"><span class="project-initial">${esc(project.name[0].toUpperCase())}</span><span class="project-rail-copy"><strong>${esc(project.name)}</strong><span>${projectTasks(project.id).length} 个任务 · ${esc(project.desc)}</span></span><span class="project-rail-count">${projectTasks(project.id).length}</span></button>`).join('');
    return `<aside class="rail c-project-rail ${state.railCollapsed ? 'collapsed' : ''}" aria-label="项目选择"><div class="rail-brand"><span class="brand-mark">t</span><span class="brand-copy">tenon<span class="brand-caption">工作空间</span></span><button class="rail-collapse" aria-label="${state.railCollapsed ? '展开' : '收缩'}项目栏" aria-expanded="${!state.railCollapsed}" onclick="toggleRail()">${ico(state.railCollapsed ? 'chevron' : 'close')}</button></div><div class="rail-section-label">项目选择</div><div class="project-rail-list">${items}</div><div class="rail-spacer"></div><div class="rail-footer"><button onclick="navigate('projects')">${ico('folder')}<span class="label">所有项目</span></button><button onclick="navigate('settings')">${ico('settings')}<span class="label">设置</span></button></div></aside>`;
  }
  function renderCTopbar() {
    if (state.page !== 'workbench' && state.page !== 'progress') return _originalRenderTopbar();
    const viewItems = [['workbench','工作台'],['progress','阶段'],['automation','自动化'],['machine','机器']];
    return `<header class="topbar c-topbar"><div class="crumb"><span class="crumb-project">工作空间</span><span class="crumb-sep">/</span><strong>${esc(pageLabel[state.page])}</strong></div><div class="project-switch-wrap"><button class="project-switch" aria-expanded="${state.projectMenu}" onclick="toggleProjectMenu()"><span class="project-dot"></span><span class="project-switch-name">${esc(currentProject().name)}</span>${ico(state.projectMenu ? 'up' : 'down')}</button><div class="project-menu" ${state.projectMenu ? '' : 'hidden'}><div class="project-menu-head">切换项目</div>${projects.map((project) => `<button class="project-option ${project.id === state.project ? 'active' : ''}" onclick="setProject('${project.id}')"><span class="project-dot"></span><span class="project-option-copy"><strong>${esc(project.name)}</strong><span>${esc(project.desc)}</span></span><span class="project-option-count">${projectTasks(project.id).length}</span></button>`).join('')}</div></div><nav class="view-nav" aria-label="工作空间页面">${viewItems.map(([id,label]) => `<button class="${state.page === id ? 'active' : ''}" onclick="navigate('${id}')">${label}</button>`).join('')}</nav><label class="top-search" title="搜索当前项目">${ico('search')}<input data-global-search type="search" aria-label="搜索项目或任务" placeholder="搜索" value="${esc(state.query)}" oninput="setQuery(this.value)"><kbd>/</kbd></label><div class="top-actions"><span class="readonly-chip">只读视图</span><span class="connection-chip"><span class="connection-dot"></span>已连接</span><span class="avatar">A</span></div></header>`;
  }
  function cStage(task) {
    const index = stageIndex(task.stage);
    return `<div class="c-read-stage" aria-label="阶段进度">${stages.map((stage, i) => `<div class="c-read-stage-item ${i < index ? 'done' : i === index ? 'current' : ''}"><div class="bar"></div><span>${stage.label}</span></div>`).join('')}</div>`;
  }
  function cFileRow(file) {
    const [name, description, missing] = file;
    return `<button class="file-row" onclick="selectFile('${esc(name)}')">${ico('file')}<span class="file-copy"><strong>${esc(name)}</strong><span>${esc(description)}</span></span><span class="file-state ${missing ? 'missing' : ''}">${missing ? '缺失' : '可读'}</span></button>`;
  }
  function cPreview(task, file) {
    if (!file) return '';
    return `<div class="c-read-preview"><div class="document-head"><span>${esc(file[0])}</span><span class="file-state ${file[2] ? 'missing' : ''}">${file[2] ? '尚未生成' : '可读'}</span></div><div class="document-body">${file[2] ? `<h3>等待产出</h3><p>这个文件尚未生成，完成终端任务后会动态出现在这里。</p>` : `<h3>${esc(task.name)}</h3><p>${esc(file[1])} · 文件内容从 Change 目录读取。</p><code>${esc(task.id)}/${esc(file[0])}</code>`}</div></div>`;
  }
  function renderCWorkspace() {
    const counts = filterCounts();
    const list = filteredTasks();

    if (task && task.project !== state.project) state.task = projectTasks()[0]?.id || task.id;
    const active = selectedTask();
    if (!active) return `<div class="c-workspace-shell"><div class="c-empty">当前项目暂无任务。</div></div>`;
    const files = state.fileTab === 'input' ? active.inputs : active.outputs;
    const selected = files.find((file) => file[0] === state.fileName) || files.find((file) => !file[2]) || files[0];
    const readable = files.filter((file) => !file[2]).length;
    const currentStage = stages.find((stage) => stage.id === active.stage);
    return `<div class="c-workspace-shell ${state.sheet === 'mobile-reading' ? 'reading' : ''}"><aside class="c-task-pane"><p class="eyebrow">${esc(currentProject().name)} · 工作空间</p><h1>任务</h1><div class="status-explain"><strong>需要你</strong> = 待决定 / 受阻</div><label class="inline-search">${ico('search')}<input data-task-search type="search" aria-label="搜索当前项目任务" placeholder="搜索任务" value="${esc(state.query)}" oninput="setQuery(this.value)"></label><div class="filter-row" aria-label="任务筛选">${renderFilterRow(counts)}</div><div class="task-list">${list.length ? list.map(taskRow).join('') : `<div class="empty-state"><strong>没有匹配的任务</strong>清除搜索或筛选后继续</div>`}</div></aside><section class="c-read-pane"><button class="button ghost c-mobile-back" onclick="state.sheet=null;render()">← 返回任务列表</button><div class="c-read-head"><p class="eyebrow">${esc(currentStage?.label || '')} / 文件阅读</p><h2>${esc(active.name)}</h2><p class="c-read-id">${esc(active.id)}</p><div class="c-read-state">${statusChip(active)}<span>${esc(active.note)}</span></div>${cStage(active)}</div><div class="c-read-section"><div class="c-read-section-head"><strong>文件工作台</strong><span>${active.inputs.length + active.outputs.length} 个文件 · 默认折叠</span></div><div class="c-read-files"><button class="${state.fileTab === 'input' ? 'active' : ''}" onclick="setFileTab('input')">输入 <span class="count">${active.inputs.length}</span></button><button class="${state.fileTab === 'output' ? 'active' : ''}" onclick="setFileTab('output')">输出 <span class="count">${active.outputs.length}</span></button></div><div class="c-read-file-summary"><span>${state.fileTab === 'input' ? '任务依据文件' : '阶段产出文件'}</span><span>${readable} 可读 · ${files.length - readable} 缺失</span></div><div class="c-read-file-list ${state.filesExpanded ? '' : 'collapsed'}">${files.map(cFileRow).join('')}${files.length > 3 ? `<button class="c-read-file-more" onclick="toggleFiles()">${state.filesExpanded ? '收起文件列表' : `查看全部 ${files.length} 个文件`}</button>` : ''}</div>${cPreview(active, selected)}</div><div class="c-read-footer"><small>创建、安装和执行留在终端；工作台负责阅读和定位。</small><button class="button" onclick="openTaskSheet('${active.id}')">打开任务详情 ${ico('arrow')}</button></div></section></div>`;
  }
  renderRail = renderCRail;
  renderTopbar = renderCTopbar;
  renderWorkbench = renderCWorkspace;
  const _originalRender = render;
  render = function() { _originalRender(); if (state.page === 'workbench' || state.page === 'progress') { document.querySelector('.c-mobile-back')?.classList.add('sr-only'); } };
  render();
</script>

<script>
  /* Make the C header span the full browser width, exactly like the accepted workspace shell. */
  state.mobileReading = false;

    if (state.page !== 'workbench' && state.page !== 'progress') return _originalRenderRail();
    const items = projects.map((project) => `<button class="project-rail-item ${project.id === state.project ? 'active' : ''}" onclick="setProject('${project.id}')" title="${esc(project.path)}"><span class="project-initial">${esc(project.name[0].toUpperCase())}</span><span class="project-rail-copy"><strong>${esc(project.name)}</strong><span>${projectTasks(project.id).length} 个任务 · ${esc(project.desc)}</span></span><span class="project-rail-count">${projectTasks(project.id).length}</span></button>`).join('');
    const mobilePages = [['workbench','工作台','grid'],['progress','阶段','flow'],['automation','自动化','bot'],['machine','机器','server']];
    return `<aside class="rail c-project-rail ${state.railCollapsed ? 'collapsed' : ''}" aria-label="项目选择"><div class="project-rail-head"><strong>项目选择</strong><button class="rail-collapse" aria-label="${state.railCollapsed ? '展开' : '收缩'}项目栏" aria-expanded="${!state.railCollapsed}" onclick="toggleRail()">${state.railCollapsed ? '›' : '‹'}</button></div><div class="project-rail-list">${items}</div><div class="mobile-page-nav" aria-label="页面导航">${mobilePages.map(([id,label,icon]) => `<button class="${state.page === id ? 'active' : ''}" onclick="navigate('${id}')">${ico(icon)}<span>${label}</span></button>`).join('')}</div><div class="rail-spacer"></div><div class="rail-footer"><button onclick="navigate('projects')">${ico('folder')}<span class="label">所有项目</span></button><button onclick="navigate('settings')">${ico('settings')}<span class="label">设置</span></button></div></aside>`;
  };
  renderRail = renderCRail;
  const _openTaskBeforeC = openTask;
  openTask = function(taskId) {
    if (state.page !== 'workbench') return _openTaskBeforeC(taskId);
    const task = taskData.find((item) => item.id === taskId);
    if (!task) return;
    state.task = taskId;
    state.project = task.project;
    state.fileTab = 'input'; state.filesExpanded = false; state.fileName = null;

  };
  const _setProjectBeforeC = setProject;

  const _renderBeforeWideC = render;

    if (state.page !== 'workbench' && state.page !== 'progress') { _renderBeforeWideC(); return; }
    document.body.dataset.page = state.page;

    if (back) back.onclick = () => { state.mobileReading = false; render(); };
  };
  render();
</script>
