        - { kind: openspec-design, owner_step: open, producers: [openspec-propose, opsx:propose] }
        - { kind: tasks, owner_step: open, producers: [openspec-propose, opsx:propose] }
        - { kind: superpower-design, owner_step: explore, producers: [brainstorming, superpowers:brainstorming] }
        - { kind: adr, owner_step: explore, producers: [brainstorming, superpowers:brainstorming] }
        - { kind: proposal, owner_step: explore, role: update, producers: [tenon] }
        - { kind: openspec-design, owner_step: explore, role: update, producers: [tenon] }
        - { kind: tasks, owner_step: explore, role: update, producers: [tenon] }
        - { kind: delta-spec, owner_step: spec, producers: [openspec-propose, opsx:propose] }
        - { kind: superpower-plan, owner_step: spec, producers: [writing-plans, superpowers:writing-plans] }
        - { kind: plan, owner_step: spec, producers: [writing-plans, superpowers:writing-plans] }
        - { kind: proposal, owner_step: spec, role: update, producers: [tenon] }
        - { kind: openspec-design, owner_step: spec, role: update, producers: [tenon] }
        - { kind: tasks, owner_step: spec, role: update, producers: [tenon] }
        - { kind: superpower-design, owner_step: spec, role: update, producers: [tenon] }
        - { kind: adr, owner_step: spec, role: update, producers: [tenon] }
        - { kind: tasks, owner_step: build, role: update, producers: [tenon] }
        - { kind: verification-report, owner_step: verify, producers: [verification-before-completion, superpowers:verification-before-completion] }
        - { kind: tasks, owner_step: verify, role: update, producers: [tenon] }
        - { kind: applied-spec, owner_step: ship, producers: [tenon] }
        - { kind: tasks, owner_step: ship, role: update, producers: [tenon] }
        - { kind: tasks, owner_step: archive, role: update, producers: [tenon] }
      reads:
        - { step: explore, kinds: [proposal, openspec-design, tasks] }
        - { step: spec, kinds: [proposal, openspec-design, tasks, superpower-design, adr] }
        - { step: build, kinds: [proposal, openspec-design, tasks, superpower-design, adr, delta-spec, superpower-plan, plan] }
        - { step: verify, kinds: [proposal, openspec-design, tasks, superpower-design, adr, delta-spec, superpower-plan, plan] }
        - { step: ship, kinds: [proposal, openspec-design, tasks, superpower-design, adr, delta-spec, superpower-plan, plan, verification-report] }
        - { step: archive, kinds: [proposal, openspec-design, tasks, superpower-design, adr, delta-spec, superpower-plan, plan, verification-report, applied-spec] }
    steps:
      - id: open
        label: 立项
        gate: null
        skills:
          - id: openspec-propose
        inputs: []
        outputs: []
        guards:
          - type: tasks-through-step
        transitions:
          - event: open-complete
            to: explore
      - id: explore
        label: 调研
        gate: review
        skills:
          - id: openspec-explore
          - id: brainstorming
          - id: grilling
          - id: domain-modeling
          - id: codebase-design
        inputs: []
        outputs:
          - field: design_doc
            type: file_path
        artifacts:
          - field: design_doc
            type: file_path
            producer_policy: effective-phase-skills
        agents:
          executors:
            - agent: researcher
        guards:
          - type: file-exists
            field: design_doc
          - type: tasks-through-step
        transitions:
          - event: explore-complete
            to: spec
      - id: spec
        label: 规格
        gate: review
        skills:
          - id: openspec-propose
          - id: writing-plans
        inputs:
          - field: design_doc
            type: file_path
        outputs:
          - field: plan
            type: file_path
        artifacts:
          - field: plan
            type: file_path
            producer_policy: effective-phase-skills
        guards:
          - type: file-exists
            field: plan
            when:
              track_not_in: [pm]
          - type: tasks-at-least
            n: 3
          - type: tasks-through-step
        test_policy:
          plan: required
          kinds: [unit]
        transitions:
          - event: spec-complete
            to: build
            actions:
              - type: reset-pre-verify-review
      - id: build
        label: 实现
        gate: null
        skills:
          - id: test-driven-development
        inputs:
          - field: design_doc
            type: file_path
          - field: plan
            type: file_path
        outputs:
          - field: build_sha
            type: string
        agents:
          executors:
            - agent: builder
        guards: []
        test_policy:
          run: [unit]
          run_if_registered: [typecheck]
          scope: changed
          files: registered
        transitions:
          - event: build-complete
            to: verify
            guards:
              - type: field-equals
                field: pre_verify_review_result
                value: pass
              - type: tasks-through-step
              - type: not-afk-queued
              - type: dependencies-ended
            actions:
              - type: freeze-build-sha
          - event: requirements-changed
            to: spec
            actions:
              - type: reset-pre-verify-review
      - id: verify
        label: 验证
        gate: review
        max_rounds: 2
        skills:
          - id: verification-before-completion
        inputs:
          - field: build_sha
            type: string
        outputs:
          - field: verification_report
            type: file_path
        artifacts:
          - field: verification_report
            type: file_path
            producer_policy: effective-phase-skills
        tests:
          - id: code-size
            direction: code-size
            command: tenon test code-size --json
            label: 代码规模
            timeout_s: 120
            required: true
            pass:
              metrics:
                - name: lines_added
                  max: 2000
        agents:
          reviewers:
            - agent: spec-consistency
              required: true
              block_at: medium
            - agent: backend-quality
              required: true
              block_at: medium
            - agent: security
              required: true
              block_at: medium
            - agent: architecture
              required: false
              block_at: high
              depends_on: [spec-consistency, backend-quality, security]
            - agent: code-size
              required: true
              block_at: medium
              reads_tests: [code-size]
        guards: []
        test_policy:
          run: [unit]
          run_if_registered: [integration, regression, benchmark]
          scope: full
          files: registered
          coverage: { lines: 80 }
          benchmark: { require_baseline: false }
        transitions:
          - event: verify-pass
            to: ship
            guards:
              - type: file-exists
                field: verification_report
              - type: build-head-unchanged
                field: build_sha
              - type: tasks-through-step
            actions:
              - type: mark-verification-passed
          - event: verify-fail
            to: build
            actions:
              - type: mark-verification-failed
              - type: reset-pre-verify-review
      - id: ship
        label: 交付
        gate: null
        skills:
          - id: finishing-a-development-branch
        inputs:
          - field: verification_report
            type: file_path
        outputs:
          - field: pr_url
            type: string
        guards:
          - type: field-nonempty
            field: pr_url
          - type: spec-migration-applied
          - type: tasks-through-step
        transitions:
          - event: ship-complete
            to: archive
      - id: archive
        label: 完结
        gate: null
        skills: []
        inputs:
          - field: pr_url
            type: string
        outputs:
          - field: archived
            type: boolean
        guards:
          - type: tasks-through-step
        transitions: []
